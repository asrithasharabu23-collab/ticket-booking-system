<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Cinema Ticket Booking
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header class="navbar">

    <div class="logo">
        🎬 Ticket Booking
    </div>


    <nav>

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('booking_history') }}">
            My Bookings
        </a>

    </nav>

</header>


<main class="container">


    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}


</main>


<footer>

    <p>
        🎟️ Cinema Ticket Booking System
    </p>

</footer>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
